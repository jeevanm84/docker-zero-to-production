<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1565C0"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2E7D32"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a5a00"/></marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#546174"/></marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#232F3E">Docker Engine &amp; Docker Swarm Architecture</text>
  <text x="800" y="68" text-anchor="middle" font-size="16" fill="#546174">From `docker run` to a running, orchestrated container</text>

  <!-- ===================== ROW 1: CLIENT / DAEMON / REGISTRY ===================== -->
  <rect x="60" y="110" width="260" height="90" rx="10" fill="#EAF3FB" stroke="#147EBA" stroke-width="1.5"/>
  <text x="190" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4C75">Docker Client</text>
  <text x="190" y="160" text-anchor="middle" font-size="12" fill="#123A55">docker run / build / ps</text>
  <text x="190" y="177" text-anchor="middle" font-size="11" fill="#123A55">CLI sends REST API calls</text>

  <line x1="320" y1="155" x2="470" y2="155" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="395" y="145" text-anchor="middle" font-size="11" fill="#1565C0">REST API</text>

  <rect x="470" y="110" width="280" height="90" rx="10" fill="#EAF3FB" stroke="#147EBA" stroke-width="1.5"/>
  <text x="610" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#0B4C75">Docker Daemon (dockerd)</text>
  <text x="610" y="157" text-anchor="middle" font-size="12" fill="#123A55">Builds images, runs containers,</text>
  <text x="610" y="174" text-anchor="middle" font-size="12" fill="#123A55">manages networks &amp; volumes</text>

  <line x1="750" y1="140" x2="1250" y2="140" stroke="#546174" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrowNavy)"/>
  <text x="1000" y="128" text-anchor="middle" font-size="11" fill="#546174">Image not found locally → pull</text>

  <rect x="1250" y="110" width="290" height="90" rx="10" stroke-dasharray="5 5" fill="#FDEDEC" stroke="#C62828" stroke-width="1.5"/>
  <text x="1395" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#7a2b2b">Registry (Docker Hub / ECR)</text>
  <text x="1395" y="157" text-anchor="middle" font-size="12" fill="#7a2b2b">Stores and serves</text>
  <text x="1395" y="174" text-anchor="middle" font-size="12" fill="#7a2b2b">versioned image layers</text>

  <!-- ===================== ROW 2: DOCKER OBJECTS ===================== -->
  <line x1="610" y1="200" x2="610" y2="245" stroke="#546174" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <text x="610" y="222" text-anchor="middle" font-size="11" fill="#546174">manages</text>

  <rect x="230" y="250" width="180" height="60" rx="8" fill="#FFF6E6" stroke="#FF9900" stroke-width="1.2"/>
  <text x="320" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">Images</text>
  <text x="320" y="294" text-anchor="middle" font-size="10.5" fill="#8a5a00">Read-only, layered</text>

  <rect x="430" y="250" width="180" height="60" rx="8" fill="#FFF6E6" stroke="#FF9900" stroke-width="1.2"/>
  <text x="520" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">Containers</text>
  <text x="520" y="294" text-anchor="middle" font-size="10.5" fill="#8a5a00">Image + writable layer</text>

  <rect x="630" y="250" width="180" height="60" rx="8" fill="#FFF6E6" stroke="#FF9900" stroke-width="1.2"/>
  <text x="720" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">Networks</text>
  <text x="720" y="294" text-anchor="middle" font-size="10.5" fill="#8a5a00">bridge / overlay / host</text>

  <rect x="830" y="250" width="180" height="60" rx="8" fill="#FFF6E6" stroke="#FF9900" stroke-width="1.2"/>
  <text x="920" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">Volumes</text>
  <text x="920" y="294" text-anchor="middle" font-size="10.5" fill="#8a5a00">persistent, shareable data</text>

  <!-- ===================== ROW 3: RUNTIME CHAIN ===================== -->
  <line x1="520" y1="310" x2="520" y2="350" stroke="#546174" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <rect x="330" y="355" width="180" height="60" rx="8" fill="#EAF7EC" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="420" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="#1e5e24">containerd</text>
  <text x="420" y="399" text-anchor="middle" font-size="10.5" fill="#1e5e24">manages container lifecycle</text>

  <line x1="510" y1="385" x2="570" y2="385" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="570" y="355" width="180" height="60" rx="8" fill="#EAF7EC" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="660" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="#1e5e24">runc</text>
  <text x="660" y="399" text-anchor="middle" font-size="10.5" fill="#1e5e24">low-level OCI runtime</text>

  <line x1="660" y1="415" x2="660" y2="450" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <rect x="440" y="455" width="440" height="70" rx="8" fill="#EAF7EC" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="660" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5e24">Linux Kernel</text>
  <text x="660" y="500" text-anchor="middle" font-size="11.5" fill="#1e5e24">Namespaces (PID, NET, MNT) → isolation · cgroups → CPU/mem/I-O limits</text>

  <line x1="660" y1="525" x2="660" y2="560" stroke="#1565C0" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="510" y="565" width="300" height="55" rx="8" fill="#EAF3FB" stroke="#147EBA" stroke-width="1.5"/>
  <text x="660" y="597" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4C75">Running Container Process</text>

  <!-- ===================== ROW 4: SWARM CLUSTER ===================== -->
  <text x="800" y="690" text-anchor="middle" font-size="18" font-weight="700" fill="#232F3E">Docker Swarm cluster (optional orchestration layer)</text>

  <rect x="620" y="720" width="360" height="70" rx="10" fill="#F4E9FB" stroke="#6A3D9A" stroke-width="1.5"/>
  <text x="800" y="748" text-anchor="middle" font-size="14" font-weight="700" fill="#4b2570">Manager Node</text>
  <text x="800" y="767" text-anchor="middle" font-size="11.5" fill="#4b2570">Schedules services, maintains cluster state (port 2377)</text>

  <line x1="700" y1="790" x2="380" y2="850" stroke="#6A3D9A" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="900" y1="790" x2="1220" y2="850" stroke="#6A3D9A" stroke-width="1.5" marker-end="url(#arrowNavy)"/>
  <line x1="800" y1="790" x2="800" y2="850" stroke="#6A3D9A" stroke-width="1.5" marker-end="url(#arrowNavy)"/>

  <rect x="220" y="855" width="320" height="90" rx="10" fill="#F4E9FB" stroke="#6A3D9A" stroke-width="1.5"/>
  <text x="380" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#4b2570">Worker Node 1</text>
  <text x="380" y="900" text-anchor="middle" font-size="11" fill="#4b2570">replica · replica · replica</text>
  <text x="380" y="917" text-anchor="middle" font-size="10.5" fill="#4b2570">self-healing: replaces killed replicas</text>

  <rect x="640" y="855" width="320" height="90" rx="10" fill="#F4E9FB" stroke="#6A3D9A" stroke-width="1.5"/>
  <text x="800" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#4b2570">Manager also runs tasks</text>
  <text x="800" y="900" text-anchor="middle" font-size="11" fill="#4b2570">replica · replica · replica</text>
  <text x="800" y="917" text-anchor="middle" font-size="10.5" fill="#4b2570">overlay network spans all nodes</text>

  <rect x="1060" y="855" width="320" height="90" rx="10" fill="#F4E9FB" stroke="#6A3D9A" stroke-width="1.5"/>
  <text x="1220" y="882" text-anchor="middle" font-size="13" font-weight="700" fill="#4b2570">Worker Node 2</text>
  <text x="1220" y="900" text-anchor="middle" font-size="11" fill="#4b2570">replica · replica · replica</text>
  <text x="1220" y="917" text-anchor="middle" font-size="10.5" fill="#4b2570">reachable via published port on any node</text>

  <!-- Legend -->
  <rect x="60" y="990" width="1480" height="80" rx="8" fill="#FAFAFA" stroke="#D8DEE4" stroke-width="1"/>
  <text x="80" y="1015" font-size="12.5" font-weight="700" fill="#232F3E">Legend</text>
  <text x="80" y="1035" font-size="11.5" fill="#333">Blue = client/daemon/runtime path · Green = OCI runtime + kernel isolation · Orange = Docker-managed objects · Purple = Swarm orchestration · Red dashed = external registry</text>
  <text x="80" y="1053" font-size="11.5" fill="#333">Full request-flow narrative: docs/ARCHITECTURE.md</text>
</svg>
