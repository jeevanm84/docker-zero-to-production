# The Swarm stack file the Jenkinsfile's `deploy` stage targets with
# `docker stack deploy bank -c docker-compose.yml`. Each module gets 3
# replicas spread across the Swarm cluster from labs/06. See
# docs/CI_CD_PIPELINE.md.

version: "3.8"

services:
  internetbanking:
    image: <dockerhub-username>/ib-image:latest
    ports:
      - "81:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/internetbanking

  mobilebanking:
    image: <dockerhub-username>/mb-image:latest
    ports:
      - "82:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/mobilebanking

  insurance:
    image: <dockerhub-username>/insurance-image:latest
    ports:
      - "83:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/insurance

  loan:
    image: <dockerhub-username>/loans-image:latest
    ports:
      - "84:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/loan
