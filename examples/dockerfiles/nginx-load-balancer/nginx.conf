# Nginx reverse-proxy load balancer across three backend containers.
# Paired with examples/compose/flask-nginx-lb/docker-compose.yml, where the
# backend service names below resolve via the Compose-managed user-defined
# network (see docs/STORAGE_AND_NETWORKING.md).

upstream backend {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
